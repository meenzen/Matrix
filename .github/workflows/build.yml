name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# cancel superseded runs of the same pull request, pushes to main always run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Testcontainers would pull its cleanup container (ryuk) from Docker Hub, which rate limits the shared runners. The
  # tests dispose their containers, the runner is thrown away afterwards anyway.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check matrix-rust-sdk version
        run: ./scripts/check-sdk-version.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            external/matrix-rust-sdk

      - name: Build matrix-rust-sdk
        run: cargo build --locked -p matrix-sdk-ffi
        working-directory: external/matrix-rust-sdk

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # every test project writes its own report, a fixed --coverage-output name would let them overwrite each other
      - name: Test
        run: dotnet test --no-build --coverage --coverage-output-format cobertura

      # the SDK logs and the test reports, to find the cause of failures that don't reproduce locally
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-logs-${{ github.run_attempt }}
          path: |
            test/*/bin/*/*/logs/
            TestResults/
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect coverage reports
        id: coverage
        run: echo "files=$(ls TestResults/*.cobertura.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ${{ steps.coverage.outputs.files }}
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # the release builds for all platforms are expensive, only run them once the basic build and tests passed
  packages:
    needs: build
    uses: ./.github/workflows/packages.yml
