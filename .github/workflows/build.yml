name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# cancel superseded runs of the same pull request, pushes to main always run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check matrix-rust-sdk version
        run: ./scripts/check-sdk-version.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            external/matrix-rust-sdk

      - name: Build matrix-rust-sdk
        run: cargo build -p matrix-sdk-ffi
        working-directory: external/matrix-rust-sdk

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: TestResults/coverage.cobertura.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # the release builds for all platforms are expensive, only run them once the basic build and tests passed
  packages:
    needs: build
    uses: ./.github/workflows/packages.yml
