name: Native libraries

# Builds the native library with the release profile on native runners for every supported platform, tests it and
# uploads it as a native-<rid> artifact. Used by the build workflow for pull requests and by the NuGet workflow.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # upstream's size optimized profile (opt-level "s" + LTO), additionally strip the symbol table to keep the package small
  CARGO_PROFILE: small-release-stripped
  CARGO_PROFILE_SMALL_RELEASE_STRIPPED_STRIP: symbols

jobs:
  native:
    name: Build native library (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # the linux runners determine the minimum glibc version of the native library (2.35 for ubuntu 22.04)
          - rid: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            library: libmatrix_sdk_ffi.so
          - rid: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            library: libmatrix_sdk_ffi.so
          - rid: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            library: matrix_sdk_ffi.dll
            # windows runners can't run the linux homeserver container, so only the smoke tests run there
            test-filter: /*/*/*/*[Category!=Homeserver]
          - rid: win-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            library: matrix_sdk_ffi.dll
            test-filter: /*/*/*/*[Category!=Homeserver]

    steps:
      - uses: actions/checkout@v7
        with:
          # Nerdbank.GitVersioning needs the full history to compute the version when building the tests
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            external/matrix-rust-sdk

      # aws-lc-sys requires clang-cl on windows arm64, Visual Studio ships one
      - name: Add clang-cl to PATH
        if: matrix.rid == 'win-arm64'
        shell: pwsh
        run: |
          if (Get-Command clang-cl -ErrorAction SilentlyContinue) { exit 0 }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $llvm = Join-Path $vs 'VC\Tools\Llvm\ARM64\bin'
          if (-not (Test-Path (Join-Path $llvm 'clang-cl.exe'))) { throw "clang-cl not found in $llvm" }
          Add-Content $env:GITHUB_PATH $llvm

      - name: Build matrix-sdk-ffi
        shell: bash
        run: cargo build -p matrix-sdk-ffi --profile "$CARGO_PROFILE" --target ${{ matrix.target }}
        working-directory: external/matrix-rust-sdk

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # test the exact library that ends up in the package
      - name: Test native library
        shell: bash
        env:
          TEST_FILTER: ${{ matrix.test-filter }}
        run: >-
          dotnet test --project test/Matrix.RustSdk.Tests
          -p:NativeLibraryPath="../../external/matrix-rust-sdk/target/${{ matrix.target }}/$CARGO_PROFILE/${{ matrix.library }}"
          ${TEST_FILTER:+--treenode-filter "$TEST_FILTER"}

      - name: Collect native library
        shell: bash
        run: |
          mkdir -p native/runtimes/${{ matrix.rid }}/native
          cp external/matrix-rust-sdk/target/${{ matrix.target }}/"$CARGO_PROFILE"/${{ matrix.library }} native/runtimes/${{ matrix.rid }}/native/

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: native/
          if-no-files-found: error
          # pull requests upload them too, they're only needed until the package is assembled
          retention-days: 7
