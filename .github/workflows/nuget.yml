name: Publish NuGet package

on:
  workflow_dispatch:

jobs:
  packages:
    uses: ./.github/workflows/packages.yml

  publish:
    name: Publish to nuget.org
    needs: packages
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # trusted publishing: nuget.org exchanges the GitHub OIDC token for a short-lived API key
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: packages/

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # requires a trusted publishing policy on nuget.org for this repository, nuget.yml and the production environment
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          # the nuget.org profile name, not the email address
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/**/*.nupkg" --api-key "$NUGET_API_KEY" --skip-duplicate --source https://api.nuget.org/v3/index.json

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # the job token can create the tag and the release, no personal access token required
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: packages/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/create-release.sh packages
