name: Publish NuGet package

on:
  workflow_dispatch:

jobs:
  native:
    uses: ./.github/workflows/native.yml

  pack:
    name: Pack and publish
    needs: native
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native/
          merge-multiple: true

      - name: Show native libraries
        run: find native -type f -exec ls -la {} \;

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: src/*/bin/Release/*.nupkg

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "src/*/bin/Release/*.nupkg" --api-key "$NUGET_API_KEY" --skip-duplicate --source https://api.nuget.org/v3/index.json
