# cargo-about configuration for THIRD-PARTY-NOTICES.txt, see scripts/generate-notices.sh

# licenses used by the dependencies of matrix-sdk-ffi, in order of preference for crates with a choice of licenses
accepted = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "MPL-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "CC0-1.0",
  "MIT-0",
  "0BSD",
  "Unlicense",
]

# the platforms the native libraries are built for
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
